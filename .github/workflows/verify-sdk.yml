name: Verify SDK

on:
  push:
    branches: [main]
    paths: ["verify-sdk/**", ".github/workflows/verify-sdk.yml"]
  pull_request:
    paths: ["verify-sdk/**", ".github/workflows/verify-sdk.yml"]

jobs:
  verify-sdk:
    name: typecheck · test · build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: verify-sdk
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: verify-sdk/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test (incl. live computeAddress and vault_address on the deployed factories)
        env:
          # Override with private RPC secrets for reliability; defaults to public endpoints.
          ETHEREUM_RPC: ${{ secrets.ETHEREUM_RPC || 'https://ethereum-rpc.publicnode.com' }}
          POLYGON_RPC: ${{ secrets.POLYGON_RPC || 'https://polygon-bor-rpc.publicnode.com' }}
          BASE_RPC: ${{ secrets.BASE_RPC || 'https://base-rpc.publicnode.com' }}
          SEPOLIA_RPC: ${{ secrets.SEPOLIA_RPC || 'https://ethereum-sepolia-rpc.publicnode.com' }}
          AMOY_RPC: ${{ secrets.AMOY_RPC || 'https://polygon-amoy-bor-rpc.publicnode.com' }}
          STELLAR_TESTNET_RPC: ${{ secrets.STELLAR_TESTNET_RPC || 'https://soroban-testnet.stellar.org' }}
          # No public default: its suite runs once the secret is set and mainnet has a VaultFactory.
          STELLAR_MAINNET_RPC: ${{ secrets.STELLAR_MAINNET_RPC }}
        run: npm test

      - name: Build
        run: npm run build
